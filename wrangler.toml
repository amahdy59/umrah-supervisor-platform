name = "umrah-supervisor"
compatibility_date = "2026-11-01"
pages_build_output_dir = "dist"

# ---------------------------------------------------------------------------
# Cloudflare D1 — live cross-device sync
# ---------------------------------------------------------------------------
# 1. Create the database:   npx wrangler d1 create umrah-db
# 2. Copy the database_id output below, then uncomment the block.
# 3. Apply migrations:      npx wrangler d1 migrations apply umrah-db --remote
# 4. In Cloudflare Pages dashboard → Settings → Environment variables, add:
#      SYNC_SECRET = <your strong secret token>
#    DO NOT commit the real SYNC_SECRET value here.
# ---------------------------------------------------------------------------
# [[d1_databases]]
# binding        = "DB"
# database_name  = "umrah-db"
# database_id    = ""         # <-- paste id from step 1
# migrations_dir = "packages/database-schema/migrations"

# ---------------------------------------------------------------------------
# Public environment variables (non-secret, committed)
# Set SYNC_SECRET only in the Cloudflare Pages dashboard, never here.
# ---------------------------------------------------------------------------
# [vars]
# SYNC_SECRET = ""   # placeholder — real value goes in dashboard only
